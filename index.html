  <style>
    :root {
      --cpc-bg: #000080;
      --cpc-border: #000050;
      --cpc-yellow: #ffff00;
      --cpc-cyan: #00ffff;
      --cpc-white: #ffffff;
      --cpc-red: #ff3333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--cpc-border);
      font-family: 'Consolas', 'Courier New', monospace;
      color: var(--cpc-yellow);
      overflow: hidden;
    }

    #crt-screen {
      width: 100vw;
      height: 100vh;
      background-color: var(--cpc-bg);
      border: 24px solid var(--cpc-border);
      padding: 24px 30px;
      font-size: 16px;
      line-height: 1.4;
      position: relative;
      overflow-y: auto;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
    }

    #crt-screen::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 50;
    }

    #screen-content {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .cpc-header {
      margin-bottom: 20px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cpc-cyan { color: var(--cpc-cyan); }
    .cpc-white { color: var(--cpc-white); }

    #log {
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 6px;
    }

    .command-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      margin-top: 4px;
    }

    .prompt-label {
      font-weight: bold;
      margin-right: 8px;
      text-transform: uppercase;
      user-select: none;
    }

    .input-wrapper {
      display: inline-flex;
      align-items: center;
      position: relative;
    }

    #hidden-input {
      position: absolute;
      opacity: 0;
      left: -9999px;
      pointer-events: none;
    }

    #typed-text {
      white-space: pre;
      font-weight: bold;
      text-transform: uppercase;
    }

    .cpc-cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background-color: var(--cpc-yellow);
      animation: cpc-blink 0.65s steps(1) infinite;
      vertical-align: middle;
      margin-left: 2px;
    }

    @keyframes cpc-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playPsgSound(freq, duration = 0.08, type = 'square') {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

const inventory = RAW_DATA.map(item => ({
  "Artikel/Modell": item[0],
  "Anzahl": item[1],
  "Seriennummer": item[2],
  "Schrank": item[3],
  "Fach": item[4]
}));

const log = document.getElementById('log');
const typedText = document.getElementById('typed-text');
const hiddenInput = document.getElementById('hidden-input');
const status = document.getElementById('db-status');
const crt = document.getElementById('crt-screen');

const totalQty = inventory.reduce((sum, item) => sum + (parseInt(item.Anzahl) || 1), 0);
status.innerText = `ONLINE (${inventory.length} DATENSÄTZE / ${totalQty} ARTIKEL VORRÄTIG)`;

function print(txt) {
  log.textContent += txt + "\n";
  crt.scrollTop = crt.scrollHeight;
}

hiddenInput.addEventListener('input', () => {
  typedText.textContent = hiddenInput.value;
  playPsgSound(380, 0.02);
});

hiddenInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = hiddenInput.value;
    hiddenInput.value = '';
    typedText.textContent = '';
    runQuery(val);
  }
});

document.addEventListener('click', () => hiddenInput.focus());
window.addEventListener('DOMContentLoaded', () => hiddenInput.focus());

function runQuery(raw) {
  let query = raw.trim();
  if (!query) return;

  print(`Ready ${query}`);

  let upper = query.toUpperCase();

  if (upper === 'EXIT' || upper === 'QUIT' || upper === 'BYE') {
    playPsgSound(220, 0.2, 'sawtooth');
    print("SYSTEM SHUTDOWN...");
    setTimeout(() => {
      window.open('', '_self', '');
      window.close();
      // Falls window.close() durch Browser blockiert wird:
      document.body.innerHTML = '<div style="background:#000;color:#555;display:flex;justify-content:center;align-items:center;height:100vh;font-family:monospace;font-size:20px;">SYSTEM HALTED. BITTE FENSTER SCHLIESSEN (ALT+F4).</div>';
    }, 400);
    return;
  }
  if (upper === 'CLS') {
    log.textContent = '';
    return;
  }
  if (upper === 'CAT' || upper === '|DIR') {
    print(`DIRECTORY OF DRIVE A:\n LAGER.BAS    32K\n BESTAND.DAT ${inventory.length} REC\nReady`);
    return;
  }
  if (upper === 'HILFE' || upper === 'HELP') {
    print("MÖGLICHE EINGABEN:\n- ARTIKELNAME: Z.B. MR46, AP2802, ADTRAN, ONE20\n- FRAGEN: 'WIE VIELE MR46 HABEN WIR?'\n- SCHRANK: S011, S001, S003\n- BEFEHLE: CLS (LEEREN), CAT (DATEIEN)\nReady");
    return;
  }

  let clean = upper
    .replace(/WIE\s+VIELE|HABEN\s+WIR|VORRÄTIG|LAGERND|LIEGEN|GIBT\s+ES|IM\s+LAGER|AUF\s+LAGER|BESTAND|BITTE|ZEIGE|WO\s+IST|WO\s+SIND/gi, '')
    .replace(/[?!.,]/g, '')
    .trim();

  if (!clean) clean = upper;

  let hits = inventory.filter(row => {
    let art = (row['Artikel/Modell'] || '').toUpperCase();
    let schrank = (row['Schrank'] || '').toUpperCase();
    let fach = (row['Fach'] || '').toUpperCase();
    let sn = (row['Seriennummer'] || '').toString().toUpperCase();

    return art.includes(clean) || schrank.includes(clean) || fach.includes(clean) || sn.includes(clean);
  });

  if (hits.length === 0) {
    playPsgSound(110, 0.3, 'sawtooth');
    print(`Line 10: NOT FOUND - Keine Artikel zu "${clean}" im Lagerbestand.\nReady`);
    return;
  }

  playPsgSound(659, 0.08);
  setTimeout(() => playPsgSound(880, 0.12), 70);

  let totalHitsQty = 0;
  let grouped = {};

  hits.forEach(item => {
    let qty = parseInt(item.Anzahl) || 1;
    totalHitsQty += qty;
    let model = item['Artikel/Modell'];
    let loc = `${item.Schrank} (Fach: ${item.Fach})`;

    if (!grouped[model]) grouped[model] = { qty: 0, spots: {} };
    grouped[model].qty += qty;
    grouped[model].spots[loc] = (grouped[model].spots[loc] || 0) + qty;
  });

  print("--------------------------------------------------");
  print(`SUMME: ${totalHitsQty} STÜCK VERFÜGBAR`);
  print("--------------------------------------------------");

  for (let model in grouped) {
    print(`ARTIKEL: ${model.toUpperCase()}`);
    print(`MENGE  : ${grouped[model].qty} Stk.`);
    print(`POSITIONEN:`);
    for (let spot in grouped[model].spots) {
      print(`  * ${spot} -> ${grouped[model].spots[spot]} Stk.`);
    }
    print("");
  }
  print("Ready");
}
